<!DOCTYPE html>
<html lang="en">
<head>
    <!-- This tells the browser how to read text characters properly -->
    <meta charset="UTF-8">

    <!-- This helps the page look good on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- This is the title shown on the browser tab -->
    <title>WeatherNow</title>

    <!-- This connects our CSS file from the static folder -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- Main container for the app content -->
    <div class="container">

        <!-- App heading -->
        <h1>WeatherNow</h1>

        <!-- Short description of the app -->
        <p>Search for the current weather in any city.</p>

        <!-- This form will later allow the user to enter a city -->
        <form id="weatherForm">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="Enter city name"
                required
            >
            <button type="submit">Get Weather</button>
        </form>

        <!-- This is where we will display the weather result -->
        <div id="weatherResult"></div>

    </div>

    <!-- This connects our JavaScript file from the static folder -->
    <script src="/static/script.js?v=2"></script>
</body>
</html>
